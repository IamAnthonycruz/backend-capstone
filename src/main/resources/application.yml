# Base configuration shared by all profiles.
# Every value is overridable via environment variables (12-factor config).
# Profile-specific overrides live in application-dev.yml / application-prod.yml.

spring:
  application:
    name: read-shelf
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # --- Relational database (PostgreSQL) ---
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/readshelf}
    username: ${DB_USERNAME:readshelf}
    password: ${DB_PASSWORD:readshelf}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; JPA never generates DDL.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # --- Migrations (Flyway) ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # --- Cache / Redis ---
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Bounds how long a cache call blocks before it throws and fail-open kicks in.
      # timeout = per-command wait; connect-timeout = initial socket connect.
      timeout: 60ms
      connect-timeout: 60ms
  cache:
    type: redis

  # --- Messaging (RabbitMQ) ---
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:readshelf}
    password: ${RABBITMQ_PASSWORD:readshelf}
    listener:
      simple:
        # THE important switch. Spring AMQP's default is `true`, which puts a failed message
        # straight back on the queue to be redelivered immediately, forever — the poison-message
        # hot loop. `false` means a rejected message is dead-lettered instead (or dropped, if the
        # queue has no DLX — which is why RabbitConfig gives every queue one).
        default-requeue-rejected: false
        retry:
          # In-memory retry INSIDE the listener, before the message is ever rejected. This is
          # what gives transient failures (SMTP blip) a second chance without a broker round
          # trip. 4 attempts backing off 2s -> 4s -> 8s, so ~14s of grace before dead-lettering.
          enabled: true
          max-attempts: 4
          initial-interval: 2s
          multiplier: 2
          max-interval: 30s

  # --- Search (Elasticsearch) ---
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
    # Same lesson as spring.data.redis.timeout in Phase 10: falling back gracefully only works
    # if the failure ARRIVES quickly. The defaults (1s connect, 30s socket) mean a wedged
    # Elasticsearch — reachable, but never answering — would hang the request for half a minute
    # before the catch block could return its friendly empty result. These bound the wait to
    # roughly two seconds, which is already slow for a search box.
    connection-timeout: ${ELASTICSEARCH_CONNECT_TIMEOUT:500ms}
    socket-timeout: ${ELASTICSEARCH_SOCKET_TIMEOUT:2s}

  # --- Email (JavaMailSender; MailHog in dev) ---
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

  # Let Spring start even when an optional backing service is briefly unavailable.
  # spring-boot-docker-compose auto-starts the compose file during local dev runs.
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:true}
      file: docker-compose.yml
      lifecycle-management: start-only

  # --- Scheduled task execution ---
  task:
    scheduling:
      # Defaults to 1, which SERIALIZES every @Scheduled method onto one thread — a long overdue
      # sweep would stall the outbox poller for its whole duration. Not a throughput tuning knob:
      # the value is "how many jobs must not block each other", so RAISE THIS when adding a job.
      # Currently OutboxPoller.publishPendingEvents + OverdueLoanChecker.flagOverdueLoans
      # + OutboxCleanupJob.deleteOldProcessedEvents.
      # Actual pool/queue SIZING under load belongs to Phase 21.
      pool:
        size: ${SCHEDULING_POOL_SIZE:3}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# --- Logging ---
# %X{correlationId} pulls the id CorrelationIdFilter puts in MDC into every log line, so a
# whole request can be grep'd by its id. The `:-` default keeps off-request lines (startup,
# scheduled jobs) from printing an empty-key placeholder. Full structured JSON logging via
# logback-spring.xml comes in Phase 18; this is the lightweight interim.
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{correlationId:-}] %-5level %logger{36} - %msg%n"

# --- Object storage (MinIO) ---
# No Spring auto-configuration exists for MinIO; these keys are bound by a
# @ConfigurationProperties class added in the object-storage phase.
readshelf:
  jobs:
    # Nightly overdue sweep. Six fields (leading one is SECONDS, unlike Unix cron).
    # Override to something like "*/20 * * * * *" to exercise it locally.
    overdue-check-cron: ${OVERDUE_CHECK_CRON:0 0 2 * * *}
    # Outbox cleanup, an hour after the sweep so the two don't contend for a scheduler thread
    # (the sweep is the one that writes outbox rows).
    outbox-cleanup-cron: ${OUTBOX_CLEANUP_CRON:0 0 3 * * *}
    # How long a PUBLISHED outbox row is kept before deletion. Bound as a java.time.Duration,
    # so ISO-8601 (PT12H) or Spring's shorthand (7d, 12h) both parse.
    outbox-retention: ${OUTBOX_RETENTION:7d}
  mail:
    # Sender identity for outbound notifications. Environment-specific by nature: dev points at
    # MailHog and nobody checks the domain, prod must use a domain you actually control or
    # SPF/DKIM will bounce the mail.
    from: ${MAIL_FROM:noreply@readshelf.com}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:readshelf}
    secret-key: ${MINIO_SECRET_KEY:readshelf-secret}
    bucket: ${MINIO_BUCKET:book-covers}
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-prod-this-must-be-at-least-256-bits-long}
      access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}

# --- Observability (Actuator + Prometheus) ---
management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSE:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# --- API documentation (SpringDoc / Swagger UI) ---
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui